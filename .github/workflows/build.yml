name: Build Windows exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pynput pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name InputOverlay input_overlay.py

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: InputOverlay-exe
          path: dist/InputOverlay.exe
